name: 解压并编译 LiquidBounce

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出仓库代码
      - name: 检出代码
        uses: actions/checkout@v4

      # 2. 调试：列出仓库根目录所有文件（检查 zip 包位置）
      - name: 列出仓库文件
        run: |
          echo "=== 仓库根目录内容 ==="
          ls -la

      # 3. 解压所有 .zip 文件到当前目录（修正版）
      - name: 解压 zip 文件
        run: |
          # 查找所有 .zip 文件并解压
          for zipfile in *.zip; do
            if [ -f "$zipfile" ]; then
              echo "找到并解压: $zipfile"
              # 解压到当前目录，覆盖已有文件
              unzip -o "$zipfile"
              # 解压后删除原 zip 文件，避免干扰后续步骤
              rm "$zipfile"
            fi
          done

      # 4. 再次列出文件，确认 build.gradle 是否出现
      - name: 确认源码结构
        run: |
          echo "=== 解压后根目录内容 ==="
          ls -la
          echo "=== 查找 build.gradle ==="
          find . -name "build.gradle" -type f

      # 5. 设置 JDK 8
      - name: 设置 JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: 8
          distribution: 'temurin'

      # 6. 赋予 gradlew 执行权限（如果存在）
      - name: 授权 gradlew
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          else
            echo "错误: 找不到 gradlew 文件，请检查压缩包内是否包含项目根目录的所有文件"
            exit 1
          fi

      # 7. 编译项目
      - name: 开始编译
        run: ./gradlew build --no-daemon

      # 8. 上传编译好的 jar 文件
      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: LiquidBounce-编译成品
          path: build/libs/*.jar
