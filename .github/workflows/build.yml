name: 解压并编译 LiquidBounce

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      # 1. 检出代码
      - name: 检出代码
        uses: actions/checkout@v4

      # 2. 如果有 zip 文件，解压它
      - name: 解压 zip 文件
        run: |
          # 查找所有 zip 文件
          for zipfile in $(find . -name "*.zip" -type f); do
            echo "找到 zip 文件: $zipfile"
            # 解压到当前目录
            unzip -o "$zipfile" -d ./
            # 删除原 zip 文件
            rm "$zipfile"
          done
        shell: bash

      # 3. 列出文件结构（调试用）
      - name: 查看文件结构
        run: |
          echo "=== 文件列表 ==="
          ls -la
          echo "=== src 目录 ==="
          ls -la src/ 2>/dev/null || echo "src 目录不存在"
          echo "=== build.gradle ==="
          cat build.gradle 2>/dev/null | head -20 || echo "build.gradle 不存在"

      # 4. 设置 JDK 8
      - name: 设置 JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: 8
          distribution: 'temurin'

      # 5. 赋予 gradlew 执行权限
      - name: 赋予执行权限
        run: chmod +x gradlew

      # 6. 编译
      - name: 编译项目
        run: ./gradlew build --no-daemon

      # 7. 上传编译结果
      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: LiquidBounce-编译完成
          path: build/libs/*.jar
